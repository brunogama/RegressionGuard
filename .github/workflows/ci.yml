name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pull-request-validation:
    name: Validate pull request
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Conventional Commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git log --format='%h%x09%s' "$BASE_SHA..$HEAD_SHA" | awk -F '\t' '
            BEGIN {
              pattern = "^(build|chore|ci|docs|feat|fix|perf|"
              pattern = pattern "refactor|revert|style|test)"
              pattern = pattern "(\\([[:alnum:]_./-]+\\))?(!)?: .+$"
            }
            $2 !~ pattern {
              print "Non-Conventional Commit subject: " $0
              invalid = 1
            }
            END { exit invalid }
          '

      - name: Install Swift quality tools
        run: brew install swift-format swiftlint

      - name: Run prek linters
        uses: >-
          j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece
        with:
          extra-args: --all-files

  build-and-test:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: >
          swift build --build-tests
          -Xswiftc -warnings-as-errors
          -Xswiftc -strict-concurrency=complete

      - name: Test
        run: >
          swift test --enable-code-coverage --parallel
          -Xswiftc -warnings-as-errors
          -Xswiftc -strict-concurrency=complete

      - name: Enforce RegressionGuardKit line coverage
        shell: bash
        run: ./scripts/coverage-gate.sh
