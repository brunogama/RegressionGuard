name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pull-request-validation:
    name: Validate pull request
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Conventional Commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git log --format='%h%x09%s' "$BASE_SHA..$HEAD_SHA" | awk -F '\t' '
            BEGIN {
              pattern = "^(build|chore|ci|docs|feat|fix|perf|"
              pattern = pattern "refactor|revert|style|test)"
              pattern = pattern "(\\([[:alnum:]_./-]+\\))?(!)?: .+$"
            }
            $2 !~ pattern {
              print "Non-Conventional Commit subject: " $0
              invalid = 1
            }
            END { exit invalid }
          '

      - name: Install Swift quality tools
        run: brew install swift-format swiftlint

      - name: Run prek linters
        uses: >-
          j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece
        with:
          extra-args: --all-files

  build-and-test:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: >
          swift build --build-tests
          -Xswiftc -warnings-as-errors
          -Xswiftc -strict-concurrency=complete

      - name: Test
        run: >
          swift test --enable-code-coverage --parallel
          -Xswiftc -warnings-as-errors
          -Xswiftc -strict-concurrency=complete

      - name: Enforce RegressionGuardKit line coverage
        shell: bash
        run: |
          set -euo pipefail
          profdata=$(
            find .build -path '*/codecov/default.profdata' -print -quit
          )
          bundle=$(
            find .build \
              -name RegressionGuardKitTests.xctest \
              -type d -print -quit
          )
          binary="$bundle/Contents/MacOS/RegressionGuardKitTests"
          test -n "$profdata"
          test -f "$binary"
          xcrun llvm-cov export \
            "$binary" \
            -instr-profile "$profdata" \
            -format lcov \
            > regression-guard-coverage.lcov
          read -r percentage hit total < <(
            awk -F: '
              /^SF:.*Sources\/RegressionGuardKit\// { included = 1; next }
              /^end_of_record$/ { included = 0 }
              included && /^LF:/ { total += $2 }
              included && /^LH:/ { hit += $2 }
              END {
                if (total == 0) exit 1
                printf "%.2f %d %d\n", 100 * hit / total, hit, total
              }' regression-guard-coverage.lcov
          )
          printf 'RegressionGuardKit line coverage: %s%% (%s/%s)\n' \
            "$percentage" "$hit" "$total" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v coverage="$percentage" 'BEGIN { exit coverage < 90 }'
