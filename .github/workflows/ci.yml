name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pull-request-validation:
    name: Validate pull request
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: macos-15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Conventional Commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git log --format='%h%x09%s' "$BASE_SHA..$HEAD_SHA" | awk -F '\t' '
            $2 !~ /^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([[:alnum:]_.\/-]+\))?(!)?: .+$/ {
              print "Non-Conventional Commit subject: " $0
              invalid = 1
            }
            END { exit invalid }
          '

      - name: Check Swift formatting
        run: |
          brew install swift-format swiftlint
          swift-format lint --recursive Sources Tests Plugins Package.swift

      - name: Run SwiftLint strictly
        run: swiftlint lint --strict

      - name: Cancel parallel pull-request workflows
        if: ${{ failure() }}
        uses: ./.github/actions/cancel-parallel-workflows
        with:
          head-sha: ${{ github.event.pull_request.head.sha }}

  build-and-test:
    runs-on: macos-15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --enable-code-coverage --parallel

      - name: Enforce RegressionGuardKit line coverage
        shell: bash
        run: |
          set -euo pipefail
          profdata=$(find .build -name default.profdata -print -quit)
          bundle=$(find .build -name RegressionGuardKitTests.xctest -type d -print -quit)
          binary="$bundle/Contents/MacOS/RegressionGuardKitTests"
          test -n "$profdata"
          test -f "$binary"
          read -r percentage hit total < <(
            xcrun llvm-cov export "$binary" -instr-profile "$profdata" | \
              python3 -c '
          import json
          import sys
          files = json.load(sys.stdin)["data"][0]["files"]
          summaries = [
              item["summary"]["lines"]
              for item in files
              if "Sources/RegressionGuardKit/" in item["filename"]
          ]
          total = sum(summary["count"] for summary in summaries)
          hit = sum(summary["covered"] for summary in summaries)
          if total == 0:
              raise SystemExit("No RegressionGuardKit coverage data found.")
          print(f"{100 * hit / total:.2f} {hit} {total}")
          '
          )
          printf 'RegressionGuardKit line coverage: %s%% (%s/%s)\n' \
            "$percentage" "$hit" "$total" >> "$GITHUB_STEP_SUMMARY"
          awk -v coverage="$percentage" 'BEGIN { exit coverage < 90 }'

      - name: Cancel parallel pull-request workflows
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: ./.github/actions/cancel-parallel-workflows
        with:
          head-sha: ${{ github.event.pull_request.head.sha }}
