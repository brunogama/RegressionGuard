name: Cancel parallel pull-request workflows
description: Cancels in-progress workflows for the same pull-request commit.
inputs:
  head-sha:
    description: Pull-request head SHA whose in-progress workflows must stop.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_SHA: ${{ inputs.head-sha }}
        CURRENT_RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        endpoint="repos/${GITHUB_REPOSITORY}/actions/runs"
        query="head_sha=${HEAD_SHA}&status=in_progress&per_page=100"
        gh api --paginate \
          "${endpoint}?${query}" \
          --jq '.workflow_runs[].id' |
          while read -r run_id; do
            [[ "$run_id" == "$CURRENT_RUN_ID" ]] && continue
            gh api --method POST "${endpoint}/${run_id}/cancel" || true
          done
